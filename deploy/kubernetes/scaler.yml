apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontjichi-scaler
  namespace: "#{{Namespace}}#"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontjichi-deployment  
  minReplicas: #{{MinReplicas}}#
  maxReplicas: #{{MaxReplicas}}#
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: #{{AverageUtilizationCpu}}#
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: #{{AverageUtilizationMemory}}#