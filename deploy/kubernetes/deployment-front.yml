apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontjichi-deployment
  namespace: "#{{Namespace}}#"
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontjichi-deployment
      app.kubernetes.io/component: frontjichi
      app.kubernetes.io/part-of: "#{{Namespace}}#"
      app.kubernetes.io/managed-by: azure-acr
      app.kubernetes.io/created-by: azure-pipelines
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontjichi-deployment
        app.kubernetes.io/component: frontjichi
        app.kubernetes.io/part-of: "#{{Namespace}}#"
        app.kubernetes.io/managed-by: azure-acr
        app.kubernetes.io/created-by: azure-pipelines
    spec:
      automountServiceAccountToken: false
      securityContext: 
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        supplementalGroups: 
        - 3300
      imagePullSecrets:
        - name: azure-acr

      containers:
        - name: frontjichi-deployment
          image: "#{{ImageFrontJichi}}#"
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: front-conf
            - secretRef:
                name: front-secrets
          resources:
            limits:
              memory: 40M
              cpu: 30m
            requests:
              memory: 30M
              cpu: 20m
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
          ports:
            - containerPort: 8080 
