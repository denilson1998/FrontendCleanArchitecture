apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontjichi
  namespace: "#{{Namespace}}#"
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
    appgw.ingress.kubernetes.io/health-probe-status-codes: "200-399, 404"
  labels:
    name: frontjichi-service
spec:
  tls:
  - hosts:
    - "#{{SpecTlsHostFrontJichi}}#"
    secretName: jichi-generic
  rules:
  - host: "#{{SpecTlsHostFrontJichi}}#"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: frontjichi-service
            port: 
              number: 8080 