<table>
  <thead>
    <tr>
      <td>
        <div class="header-space"></div>
      </td>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>
        <div class="content">
          <div id="invoice-POS">
            <div id="top" style="text-align: center">
              <div class="logo"></div>
              <div class="info">
                <h2>JICHI</h2>
              </div>
              <!--End Info-->
            </div>
            <!--End InvoiceTop-->

            <div id="mid">
              <div class="info">
                <h2>Ciente</h2>
                <p>
                  Nombre : {{ data.customer.fullName }}<br />
                  Email : {{ data.customer.email }}<br />
                  Teléfono : {{ data.customer.phoneNumber }}<br />
                </p>
              </div>
            </div>
            <!--End Invoice Mid-->

            <div id="bot">
              <div id="table">
                <table>
                  <tr class="tabletitle">
                    <td class="item">
                      <h2>Producto</h2>
                    </td>
                    <td class="Hours">
                      <h2>Cantidad</h2>
                    </td>
                    <td class="Rate">
                      <h2>Precio</h2>
                    </td>
                  </tr>

                  <tr class="service" *ngFor="let product of data.orderItems">
                    <td class="tableitem">
                      <p class="itemtext">{{ product.productName }}</p>
                    </td>
                    <td class="tableitem">
                      <p class="itemtext">{{ product.quantity }}</p>
                    </td>
                    <td class="tableitem">
                      <p class="itemtext">{{ product.price }}</p>
                    </td>
                  </tr>

                  <tr class="tabletitle">
                    <td></td>
                    <td class="Rate">
                      <h2>Total</h2>
                    </td>
                    <td class="payment">
                      <h2>{{ data.total }}</h2>
                    </td>
                  </tr>
                </table>
              </div>
              <!--End Table-->
            </div>
            <!--End InvoiceBot-->
          </div>
          <!--End Invoice-->
        </div>
      </td>
    </tr>
  </tbody>
  <tfoot>
    <div id="legalcopy">
      <p class="legal"><strong>Gracias por usar JICHI!</strong> </p>
    </div>
  </tfoot>
</table>
