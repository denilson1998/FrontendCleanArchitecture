<jichi-section-title label="Clientes"></jichi-section-title>
<div class="relative overflow-x-auto shadow-2xl rounded-lg bg-jichi-grayscale-white">
    
    <div *ngIf="organizationHasNoProducts !== true; else noItemsTemplate">
        <div class="flex items-center pt-6">
            <div class="relative w-1/4 p-4">
                <div class="absolute inset-y-0 left-0 flex items-center pl-6 pointer-events-none">
                    <svg aria-hidden="true" class="w-5 h-5 text-jichi-grayscale-gray" fill="currentColor"
                        viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd"
                            d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                            clip-rule="evenodd"></path>
                    </svg>
                </div>
                <input type="text" id="simple-search"
                    class="bg-jichi-grayscale-white border-2 border-jichi-grayscale-medium-gray  text-sm rounded-2xl  block w-full pl-10 p-2.5"
                    placeholder="Buscar" required>
            </div>
            <button type="submit"
                class="p-2 ml-2 text-sm font-medium text-white bg-jichi-grayscale-white rounded-2xl border-2 border-jichi-grayscale-medium-gray hover:bg-jichi-grayscale-light-gray focus:ring-2  focus:ring-jichi-grayscale-light-gray">
                <img src="assets/icons/filter.svg">
                <span class="sr-only">Buscar</span>
            </button>
            <div class="absolute right-0 flex items-center p-8">
                <jichi-add-button (onClick)="showCreateCustomerModal()" [label]="'Agregar cliente'"></jichi-add-button>
            </div>
        </div>

        <div class="pt-4">
            <jichi-table [head]="head" [data]="customersDataRow" [currentPage]="pagedCustomers?.pageNumber ?? 1"
                [totalPages]="pagedCustomers?.totalPages ?? 0" [limit]="pagedCustomers?.pageSize ?? 0"
                (changePage)="changePage($event)">
                
                <ng-template #actionsTemplate let-row>
                    <a [routerLink]="[row.id]"  class="no-underline flex font-semibold text-jichi-text-bright-blue">
                        Ver
                    </a>
                </ng-template>
            </jichi-table>
        </div>
    </div>

    <ng-template #noItemsTemplate>
        <div class="h-[79vh] flex items-center justify-center flex-col">
            <div class="flex items-center">
                <div>
                    <img class="w-44 h-44" src="assets/illustrations/notfound.png" alt="no encontrado">
                </div>
            </div>

            <div class="flex items-center justify-center flex-col pt-4">
                <jichi-section-subtitle label="¡Guardá tus clientes!"></jichi-section-subtitle>
                <jichi-span label="Hacé seguimiento de sus compras y guardá sus contactos para futuras ventas."></jichi-span>
            </div>
            <div class="flex justify-center mt-10">
                <sarao-button color="Primary" (click)="showCreateCustomerModal()">Agregar cliente</sarao-button>
            </div>
        </div>
    </ng-template>

</div>


<sarao-modal
    *ngIf="createCustomerModalIsShown"
    title="Datos del cliente"
    [(visible)]="createCustomerModalIsShown"
    styleClass="inventarioModal">
    <create-customer-modal (customerCreated)="handleCustomerCreatedOrEdited($event)"></create-customer-modal>
</sarao-modal>

<sarao-modal
    *ngIf="editCustomerModalIsShown && selectedCustomer"
    title="Datos del cliente"
    [(visible)]="editCustomerModalIsShown"
    styleClass="inventarioModal">
    <edit-customer-modal [customer]="selectedCustomer" (customerEdited)="handleCustomerCreatedOrEdited($event)"></edit-customer-modal>
</sarao-modal>
