<ng-container *ngIf="customer">
    <div class="flex justify-between">
        <h1>
            {{customer.fullName}}
        </h1>
        <a (click)="showEditCustomerModal()" class="no-underline flex font-semibold text-jichi-text-bright-blue">
            Editar
            <img class="w-6 h-6 pl-1 pb-1" src="assets/icons/pencil-edit.svg" alt="">
        </a>
    </div>

    {{customer.email}}
    {{customer.phoneNumber}}
    {{customer.location}}
    <p>
        Última venta: {{ordersLastDate | date: 'dd/MM/yyyy'}}
    </p>
    <div class="flex justify-around">
    <!-- <div class="grid grid-cols-2 gap-8"> -->
        <sarao-card>
            <div class="sarao-card-body">
                <div class="p-8 pb-4">
                    <sarao-numeric-card-chart position="start" [number]="ordersTotal" [currency]="currency"></sarao-numeric-card-chart>
                    <p class="mt-4 text-center">
                        Ventas totales
                    </p>
                </div>
            </div>
        </sarao-card>
    
        <sarao-card>
            <div class="sarao-card-body">
                <div class="p-8 pb-4">
                    <sarao-numeric-card-chart position="start" [number]="paidOrdersTotal" [currency]="currency"></sarao-numeric-card-chart>
                    <p class="mt-4 text-center">
                        Ventas pagadas
                    </p>
                </div>
            </div>
        </sarao-card>
    
        <sarao-card>
            <div class="sarao-card-body">
                <div class="p-8 pb-4">
                    <sarao-numeric-card-chart position="start" [number]="productsTotal" [currency]="''"></sarao-numeric-card-chart>
                    <p class="mt-4 text-center">
                        Productos vendidos
                    </p>
                </div>
            </div>
        </sarao-card>
    </div>

    <customer-sold-products-list *ngIf="orders" [orders]="orders"></customer-sold-products-list>
    <customer-orders-list (ordersLoaded)="handleOrdersLoaded($event)" [customerId]="customer.id"></customer-orders-list>
    <sarao-modal
        *ngIf="editCustomerModalIsShown"
        title="Datos del cliente"
        [(visible)]="editCustomerModalIsShown"
        styleClass="inventarioModal">
        <edit-customer-modal [customer]="customer" (customerEdited)="handleCustomerEdited()"></edit-customer-modal>
    </sarao-modal>
</ng-container>
