<div class=" flex flex-col items-center">
    
<div  class="container w-full bg-white rounded-lg shadow dark:border md:mt-0 sm:max-w-md xl:p-0 ">
    <div class="p-6 space-y-4 md:space-y-6 sm:p-8">
        <h1 class="text-xl font-bold leading-tight tracking-tight text-jichi-black md:text-2xl">
            Olvide mi contraseña
        </h1>
        <p class="font-medium text-primary'">
            Te vamos a enviar un correo para que reestablezcas tu contraseña
        </p>
        <form class="space-y-4 md:space-y-6" (ngSubmit)="submit()" [formGroup]="forgetForm">
            <div>
                <jichi-text [formControl]="forgetForm.controls.email" label="Correo electrónico"></jichi-text>
            </div>
            <p [hidden]="isSubmited" class="text-jichi-green text-sm font-light text-primary-600">
                Revisa tu buzon de entrada o en la seccion de spam
            </p>
            <button routerLinkActive="router-link-active" type="submit"
                class="w-full text-white bg-jichi-main-blue hover:bg-primary-700 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
                Enviar
            </button>
            <p class="text-sm font-light text-gray-500 dark:text-gray-400 text-center">
                <a [routerLink]="['/auth/login']" 
                    class="font-medium hover:text-jichi-green text-primary-600 hover:underline">
                    ¿Ya te acordaste tu contraseña? Inicia Sesión</a>
            </p>
        </form>
    </div>
</div>
</div>
