<p>Ingresá la información que deseás guardar y ver de tus clientes más frecuentes.</p>
<p>*Campos requeridos</p>
<form [formGroup]="formGroup">
    <!-- id="unico" -->
    <sarao-input
        type="email"
        label="Correo electrónico"
        error="No es un correo electrónico válido"
        [formControl]="formGroup.controls.email">
    </sarao-input>
    <sarao-dropdown
        label="Roles"
        [options]="roleTypes"
        (selected)="onRoleSelected($event)"
        >
    </sarao-dropdown>
    <sarao-input
        type="text"
        label="Nombre"
        error="Requerido"
        [formControl]="formGroup.controls.firstName"
        >
    </sarao-input>
    <sarao-input
        type="text"
        label="Primer Apellido"
        error="Requerido"
        [formControl]="formGroup.controls.firstLastName"
        >
    </sarao-input>
    <sarao-input
        type="text"
        label="Segundo Apellido"
        error="Requerido"
        [formControl]="formGroup.controls.secondLastName"
        >
    </sarao-input>
    <sarao-input
        type="text"
        label="Número de teléfono"
        [formControl]="formGroup.controls.phoneNumber"
        >
    </sarao-input>
    <sarao-button [disabled]="!formGroup.valid" color="Primary" (click)="createUser()">Registrar usuario</sarao-button>
</form>
